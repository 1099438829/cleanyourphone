# 魅族 Flyme 系统设置优化(settings put)
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释
# 用法: python3 tools/phone.py settings examples/meizu-flyme/settings.conf

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪(开启限制)

# 2. 可选: 全局去广告 DNS(国内 dot.pub / 国外 dns.adguard-dns.com)
#global private_dns_mode hostname
#global private_dns_specifier dot.pub

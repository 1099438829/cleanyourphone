# vivo / iQOO OriginOS 系统设置优化(settings put)
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释
# 用法: python3 tools/phone.py settings examples/vivo-originos/settings.conf

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪(开启限制)

# 2. OriginOS 官方开关: 设置 → 隐私 → 广告与隐私/广告推荐 → 关闭“个性化广告推荐”
#    (部分版本路径: 设置 → 更多设置 → 隐私; 也可在设置顶部搜索“广告”直达)

# 3. 可选: 全局去广告 DNS(国内 dot.pub / 国外 dns.adguard-dns.com)
#global private_dns_mode hostname
#global private_dns_specifier dot.pub

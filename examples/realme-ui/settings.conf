# realme UI 系统设置优化(settings put)
# 用法: python3 tools/phone.py settings examples/realme-ui/settings.conf
# 说明: realme UI 4.0(≈ColorOS 13)起 adb 可能无 WRITE_SETTINGS 权限,
#       工具会回读校验并如实报失败, 失败时按 README 手动关闭

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪

# 2. 锁屏画报(realme UI 3.0 及以下有效, 高版本已由 debloat 处理)
#system keyguard_apk_show_pictorial 0

# 3. 用户体验改进计划
#system oplus_customize_cta_user_experience 0

# 4. 关闭"摇一摇"广告: python3 tools/phone.py shake on

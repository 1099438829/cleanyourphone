# 一加 国行 ColorOS 系统设置优化(settings put)
# 用法: python3 tools/phone.py settings examples/oneplus-coloros/settings.conf
# 说明: ColorOS 13 起 adb shell 无 WRITE_SETTINGS, 写入会失败并如实报告

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪

# 2. 锁屏画报(仅 ColorOS 11 及以下有效)
#system keyguard_apk_show_pictorial 0

# 3. 用户体验改进计划
#system oplus_customize_cta_user_experience 0

# 4. 关闭"摇一摇"广告: python3 tools/phone.py shake on

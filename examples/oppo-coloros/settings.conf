# OPPO / 一加 / realme ColorOS 系统设置优化(settings put)
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释
# 用法: python3 tools/phone.py settings examples/oppo-coloros/settings.conf

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪(开启限制)

# 2. ColorOS 官方开关: 设置 → 权限与隐私 → 隐私 → 广告与隐私/广告推荐
#    → 关闭"个性化广告推荐"(部分版本路径: 设置 → 隐私 → 广告)

# 3. 可选: 全局去广告 DNS(国内 dot.pub / 国外 dns.adguard-dns.com)
#global private_dns_mode hostname
#global private_dns_specifier dot.pub

# ---------------------------------------------------------------------------
# 以下键名发现于真机(OPPO PEQM00, Android 13 / ColorOS 13, 见 device-inventory.md)
# 注意: 实测该 ROM 已禁止 adb shell 写入 settings(SecurityException:
# WRITE_SETTINGS 未授予 shell), 以下条目默认注释; 旧版本 ColorOS 或其他
# 品牌 ROM 可取消注释尝试, 工具会回读校验并如实报告成功/失败。
# ---------------------------------------------------------------------------
#system keyguard_apk_show_pictorial 0        # 锁屏显示乐划锁屏画报(0=关闭)
#system oplus_customize_pictorial_apply 0    # 乐划锁屏画报应用(0=关闭)
#system oplus_customize_pictorial_auto_play 0 # 画报自动播放(0=关闭)
#system oplus_customize_cta_update_pictorial 0 # 锁屏画报内容更新(0=关闭)
#system oplus_customize_cta_user_experience 0  # 用户体验改进计划(0=关闭)
#system is_mcs_upload 0                      # 欢太移动云(mcs)数据上传(0=关闭)
#secure operator_service_improve_plan 0      # 运营商服务改进计划(0=关闭)
#secure recommend_support 0                  # 内容推荐总开关(0=关闭; 影响较广, 谨慎)
#secure app_recommend_channel 0              # 应用推荐渠道(0=关闭)
#secure sidebar_recommend_declaration 0      # 侧边栏推荐声明(0=关闭)

# 传音 HiOS / XOS 系统设置优化(settings put)
# 用法: python3 tools/phone.py settings examples/transsion-hios/settings.conf

# 1. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告跟踪

# 2. 关闭使用情况统计
#secure anon_stats_enabled 0

# 3. 关闭系统更新自动下载(键名因版本而异)
#global ota_disable_automatic_update 1

# 4. 关闭"摇一摇"广告: python3 tools/phone.py shake on

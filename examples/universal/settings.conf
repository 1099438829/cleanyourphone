# 全品牌通用 系统设置优化(settings put)
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释
# 用法: python3 tools/phone.py settings examples/universal/settings.conf

# 1. 限制广告跟踪(AOSP 通用)
secure limit_ad_tracking 1 # 限制广告跟踪(开启限制)

# 2. 可选: 全局去广告 DNS(带自愈: 解析失败自动回退, 不会搞挂网络)
#    国内推荐 dot.pub, 国外推荐 dns.adguard-dns.com
#    建议直接用命令(比写死在本文件里更灵活):
#    python3 tools/phone.py dns on dot.pub
#global private_dns_mode hostname
#global private_dns_specifier dot.pub

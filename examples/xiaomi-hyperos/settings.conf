# 小米 / 红字 MIUI-HyperOS 系统设置优化(settings put)
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释
# 用法: python3 tools/phone.py settings examples/xiaomi-hyperos/settings.conf

# 1. 限制广告跟踪(AOSP 通用键, MIUI 同样有效)
secure limit_ad_tracking 1 # 限制广告跟踪(开启限制)

# 2. 关闭“加入用户体验改进计划”对应的数据上报
#    MIUI 该开关在: 设置 → 更多设置 → 开发者选项? 否 — 设置顶部搜索“体验改进计划”
#    ADB 无对应键, 请手动关闭。

# 3. MIUI 的“个性化广告推荐”开关位于:
#    设置 → 密码与安全 → 系统安全 → 广告服务 → 关闭“个性化广告推荐”
#    ADB 无法直接改写, 请手动关闭(配合 debloat.txt 停用 MSA 后效果更彻底)。

# 4. 可选: 全局去广告 DNS(建议国内用 dot.pub, 国外用 dns.adguard-dns.com)
#    取消下面两行注释后执行本文件即可, 或直接运行:
#    python3 tools/phone.py dns on dot.pub
#global private_dns_mode hostname
#global private_dns_specifier dot.pub

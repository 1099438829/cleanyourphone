# 中兴 / 努比亚 / 红魔 MyOS 系统设置优化(settings put)
# 用法: python3 tools/phone.py settings examples/zte-nubia/settings.conf
# 说明: 键名来自公开教程与 AOSP 通用键; 工具会写入后回读校验, 不生效会如实报失败

# 1. 限制广告跟踪(通用)
secure limit_ad_tracking 1 # 限制广告跟踪

# 2. 关闭使用情况统计上报(部分版本存在)
#global send_action_app_error 0
#secure anon_stats_enabled 0

# 3. 关闭系统更新自动下载(键名因版本而异, 默认注释)
#global ota_disable_automatic_update 1

# 4. 关闭"摇一摇"广告可另用: python3 tools/phone.py shake on
